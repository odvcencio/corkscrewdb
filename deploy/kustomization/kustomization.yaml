apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: m31labs
resources:
  - namespace.yaml
  - secrets.yaml
  - headless-service.yaml
  - rw-service.yaml
  - ro-service.yaml
  - statefulset.yaml
  - memory-deployment.yaml
  - memory-service.yaml
  - bootstrap-job.yaml
images:
  # The base manifests use the bare image names below. Point newName at your
  # registry (or run `kustomize edit set image corkscrewdb=<registry>/corkscrewdb:<tag>`).
  - name: corkscrewdb
    newName: registry.example.com/team/corkscrewdb
    newTag: v0.3.0
  - name: memory
    newName: registry.example.com/team/memory
    newTag: v0.3.0
